<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BalıkTahmin – Saatlik av olasılığı</title>
  <meta name="description" content="Türkiye kıyıları için saatlik balık avı olasılığı: rüzgâr, dalga, su sıcaklığı, basınç ve ay evresine göre." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
  <link rel="stylesheet" href="/style.css?v=1.1.1" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🎣</span>
      <span class="brand-name">BalıkTahmin</span>
    </div>
    <nav class="species" id="species" aria-label="Tür seçimi"></nav>
  </header>

  <main class="layout">
    <div id="map" role="application" aria-label="Mera haritası"></div>

    <aside class="panel" id="panel" aria-live="polite">
      <button class="sheet-handle" id="sheetHandle" aria-label="Paneli büyüt veya küçült"></button>
      <div id="panelBody">
        <p class="muted">Veriler yükleniyor…</p>
      </div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/app.js?v=1.1.1" type="module"></script>
</body>
</html>
